<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Equal Earth Projection Map</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #0b1a2b;
    overflow: hidden;
  }
  #map {
    display: block;
    width: 100%;
    height: 100%;
    cursor: grab;
    touch-action: none;
  }
  #map.dragging {
    cursor: grabbing;
  }
  #hud {
    position: fixed;
    left: 12px;
    bottom: 10px;
    color: #cfe3f7;
    font: 12px/1.4 system-ui, sans-serif;
    background: rgba(0, 0, 0, 0.35);
    padding: 6px 10px;
    border-radius: 6px;
    pointer-events: none;
    user-select: none;
  }
  #fallback {
    display: none;
    color: #fff;
    font: 16px/1.6 system-ui, sans-serif;
    padding: 24px;
  }
</style>
</head>
<body>
<canvas id="map" role="img" aria-label="Equal Earth Projection による世界地図。ドラッグで中心経度を変更できます。"></canvas>
<div id="hud">中心経度: <span id="lonReadout">0.0</span>° （ドラッグで回転）</div>
<div id="fallback">お使いのブラウザは Canvas に対応していません。</div>

<!--
  地図データについて:
  Natural Earth 10m land データ（CC0）を、以下のURLから fetch() で取得している。
  https://raw.githubusercontent.com/martynafford/natural-earth-geojson/master/10m/physical/ne_10m_land.json
  file:// でこのファイルを直接開くと、ブラウザの制限により fetch が失敗する場合があるため、
  ローカルHTTPサーバ経由（例: `python3 -m http.server`）で開くこと。
-->

<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------------
  // Projection module（純粋関数のみ。src/equalEarth.js と同一実装を維持する）
  // ---------------------------------------------------------------------
  const A1 = 1.340264;
  const A2 = -0.081106;
  const A3 = 0.000893;
  const A4 = 0.003796;
  const M = Math.sqrt(3) / 2;

  function toRadians(deg) {
    return (deg * Math.PI) / 180;
  }

  function toDegrees(rad) {
    return (rad * 180) / Math.PI;
  }

  // 経度を (-180, 180] の範囲に正規化する。
  function normalizeLongitude(lonDeg) {
    let lon = lonDeg % 360;
    if (lon <= -180) lon += 360;
    if (lon > 180) lon -= 360;
    return lon;
  }

  // Equal Earth Projection の投影式本体。
  // lambda, phi はラジアン（lambda は中心経度からの差分）。
  function equalEarthRaw(lambda, phi) {
    const theta = Math.asin(M * Math.sin(phi));
    const theta2 = theta * theta;
    const theta6 = theta2 * theta2 * theta2;
    const x =
      (lambda * Math.cos(theta)) /
      (M * (A1 + 3 * A2 * theta2 + theta6 * (7 * A3 + 9 * A4 * theta2)));
    const y = theta * (A1 + A2 * theta2 + theta6 * (A3 + A4 * theta2));
    return [x, y];
  }

  // 中心経度からの相対経度（度）と緯度（度）からキャンバス上のピクセル座標を求める。
  // 相対経度の正規化は行わない（呼び出し側の責務）。
  function projectRelative(relLonDeg, latDeg, scale, cx, cy) {
    const [xProj, yProj] = equalEarthRaw(toRadians(relLonDeg), toRadians(latDeg));
    return {
      x: cx + scale * xProj,
      y: cy - scale * yProj,
    };
  }

  // 経度・緯度（度）と中心経度からキャンバス上のピクセル座標を求める。
  function project(lonDeg, latDeg, centerLonDeg, scale, cx, cy) {
    const deltaLonDeg = normalizeLongitude(lonDeg - centerLonDeg);
    return projectRelative(deltaLonDeg, latDeg, scale, cx, cy);
  }

  // リング（頂点配列）を、中心経度に依存しない「連続な経度表現」に変換する。
  // 各頂点の経度を、直前の頂点に最も近い分岐（360°の整数倍だけずらした値）に
  // 補正していくことで、実際の海岸線のように隣接頂点が近い場合は
  // 経度が単調に連続し、対蹠経線（±180°）をまたいでも不連続にジャンプしない。
  // この変換は中心経度に依存しないため、データ読み込み時に1回だけ計算すればよい
  // （毎フレーム計算し直す必要がない）。
  function unwrapRingLongitudes(ring) {
    if (ring.length === 0) return [];
    const result = [[ring[0][0], ring[0][1]]];
    let prevLon = ring[0][0];
    for (let i = 1; i < ring.length; i++) {
      const [lon, lat] = ring[i];
      let unwrapped = lon;
      while (unwrapped - prevLon > 180) unwrapped -= 360;
      while (unwrapped - prevLon < -180) unwrapped += 360;
      result.push([unwrapped, lat]);
      prevLon = unwrapped;
    }
    return result;
  }

  // 連続経度化されたリング（unwrapRingLongitudesの戻り値）の経度の最小・最大値を求める。
  function ringLongitudeRange(unwrappedRing) {
    let min = Infinity;
    let max = -Infinity;
    for (const [lon] of unwrappedRing) {
      if (lon < min) min = lon;
      if (lon > max) max = lon;
    }
    return [min, max];
  }

  // 連続経度の範囲 [minLon, maxLon] を持つリングを、現在の中心経度で
  // 表示するために必要な「360°の整数倍のオフセット」の候補一覧を返す
  // （安価な事前フィルタ。正確な表示可否はこの後の clipRingToLongitudeWindow
  // が保証するため、多少余分な候補が混ざっても問題ない）。
  function longitudeShiftsForView(range, centerLonDeg) {
    const [minLon, maxLon] = range;
    const mid = (minLon + maxLon) / 2;
    const bestK = Math.round((centerLonDeg - mid) / 360);
    const viewMin = centerLonDeg - 180;
    const viewMax = centerLonDeg + 180;

    const shifts = [];
    for (let k = bestK - 2; k <= bestK + 2; k++) {
      const shift = k * 360;
      if (maxLon + shift >= viewMin && minLon + shift <= viewMax) {
        shifts.push(shift);
      }
    }
    return shifts;
  }

  // [relLon, lat] の点列を、relLon の半平面（isInside）に対してクリップする
  // （Sutherland-Hodgman法）。半平面の境界と交差する辺には、線形補間した
  // 交点 [boundaryLon, 補間緯度] を挿入する。
  function clipHalfPlane(points, isInside, boundaryLon) {
    const n = points.length;
    if (n === 0) return [];

    function intersect(a, b) {
      const t = (boundaryLon - a[0]) / (b[0] - a[0]);
      return [boundaryLon, a[1] + t * (b[1] - a[1])];
    }

    const result = [];
    let prev = points[n - 1];
    let prevInside = isInside(prev);
    for (const curr of points) {
      const currInside = isInside(curr);
      if (currInside) {
        if (!prevInside) result.push(intersect(prev, curr));
        result.push(curr);
      } else if (prevInside) {
        result.push(intersect(prev, curr));
      }
      prev = curr;
      prevInside = currInside;
    }
    return result;
  }

  // クリップ後の点列のうち、隣接する2点が同じ境界(±180°)上にあり
  // 緯度差が大きい区間を、緯度約2°刻みの中間点で細分化する。
  // Equal Earth Projection は経度を固定しても緯度によってx座標が変化する
  // （境界線は地図の輪郭に沿った滑らかな曲線）ため、この細分化がないと
  // 境界上の2点を単純な直線で結んだときに輪郭から外れて見えてしまう。
  function subdivideBoundaryEdges(points) {
    const n = points.length;
    if (n < 2) return points;

    const result = [];
    for (let i = 0; i < n; i++) {
      const curr = points[i];
      const next = points[(i + 1) % n];
      result.push(curr);
      if (curr[0] === next[0] && Math.abs(curr[0]) === 180) {
        const gap = Math.abs(next[1] - curr[1]);
        if (gap > 2) {
          const steps = Math.ceil(gap / 2);
          for (let s = 1; s < steps; s++) {
            result.push([curr[0], curr[1] + (next[1] - curr[1]) * (s / steps)]);
          }
        }
      }
    }
    return result;
  }

  // [relLon, lat] の点列（連続経度・シフト適用済み）を、表示可能な範囲
  // relLon ∈ [-180, 180] に明示的にクリップする。
  //
  // 【重要】Equal Earth Projection の x 座標は緯度によってスケールが変化する
  // （高緯度ほど小さくなる）ため、|relLon| が180°を大きく超えていても、
  // 高緯度の点では投影後のx座標がキャンバスの表示範囲内に収まってしまうことがある。
  // 「表示範囲外はCanvas自身が自然にクリップする」という前提はこの投影法では
  // 緯度によって成り立たず、境界付近で本来表示されるべきでない場所に大きな
  // 陸地の断片が現れたり消えたりする不具合につながる。そのため、投影する前に
  // relLon の範囲を明示的に切り詰める必要がある。
  function clipRingToLongitudeWindow(points) {
    let clipped = clipHalfPlane(points, (p) => p[0] <= 180, 180);
    clipped = clipHalfPlane(clipped, (p) => p[0] >= -180, -180);
    return subdivideBoundaryEdges(clipped);
  }

  // 赤道上のスケールを基準に、ドラッグのピクセル移動量を経度変化量（度）に変換する。
  function dragDeltaToLongitudeDelta(deltaPixels, scale) {
    const pxPerRadianAtEquator = scale / (M * A1);
    const deltaLonRad = -deltaPixels / pxPerRadianAtEquator;
    return toDegrees(deltaLonRad);
  }

  // 投影空間での最大x値（経度差180°、緯度0°のとき）。スケール計算に使用する。
  const PROJECTED_X_MAX = Math.PI / (M * A1);
  // 投影空間での最大y値（極点）。スケール計算に使用する。
  const PROJECTED_Y_MAX = equalEarthRaw(0, Math.PI / 2)[1];

  // ---------------------------------------------------------------------
  // Data module: Natural Earth 10m land データ（CC0）を fetch() で取得し、
  // Polygon/MultiPolygon の全リングを [経度, 緯度] の配列の配列に平坦化する。
  // src/geojson.js と同一実装（extractRings）を維持する。
  // ---------------------------------------------------------------------
  const LAND_DATA_URL =
    "https://raw.githubusercontent.com/martynafford/natural-earth-geojson/master/10m/physical/ne_10m_land.json";

  function ringsFromPolygonCoordinates(polygonCoordinates) {
    return polygonCoordinates.map((ring) => ring.map(([lon, lat]) => [lon, lat]));
  }

  function extractRings(featureCollection) {
    const rings = [];
    const features = (featureCollection && featureCollection.features) || [];

    for (const feature of features) {
      const geometry = feature && feature.geometry;
      if (!geometry) continue;

      if (geometry.type === "Polygon") {
        rings.push(...ringsFromPolygonCoordinates(geometry.coordinates));
      } else if (geometry.type === "MultiPolygon") {
        for (const polygonCoordinates of geometry.coordinates) {
          rings.push(...ringsFromPolygonCoordinates(polygonCoordinates));
        }
      }
    }

    return rings;
  }

  async function loadWorldLand() {
    try {
      const response = await fetch(LAND_DATA_URL);
      if (!response.ok) {
        throw new Error(`HTTP ${response.status} ${response.statusText}`);
      }
      const geojson = await response.json();
      // 経度の連続化と最小・最大経度の算出は中心経度に依存しないため、
      // 描画のたびに計算し直すのではなく、ここで1回だけ前処理しておく。
      state.worldLand = extractRings(geojson).map((ring) => {
        const unwrapped = unwrapRingLongitudes(ring);
        return { unwrapped, range: ringLongitudeRange(unwrapped) };
      });
      state.loadStatus = "ready";
    } catch (err) {
      console.error("Failed to load world land GeoJSON:", err);
      state.loadStatus = "error";
      state.loadError = String((err && err.message) || err);
    }
    state.needsRedraw = true;
  }

  // ---------------------------------------------------------------------
  // State
  // ---------------------------------------------------------------------
  const state = {
    centerLonDeg: 0,
    scale: 1,
    isDragging: false,
    lastPointerX: 0,
    needsRedraw: true,
    worldLand: null,
    loadStatus: "loading", // 'loading' | 'ready' | 'error'
    loadError: null,
  };

  const canvas = document.getElementById("map");
  const lonReadout = document.getElementById("lonReadout");
  const ctx = canvas.getContext("2d");

  if (!ctx) {
    canvas.style.display = "none";
    document.getElementById("fallback").style.display = "block";
    console.error("Canvas 2D context is not supported by this browser.");
    return;
  }

  // ---------------------------------------------------------------------
  // Render module
  // ---------------------------------------------------------------------
  let cssWidth = 0;
  let cssHeight = 0;

  function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    cssWidth = Math.max(1, window.innerWidth);
    cssHeight = Math.max(1, window.innerHeight);
    canvas.width = Math.round(cssWidth * dpr);
    canvas.height = Math.round(cssHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const margin = 0.92;
    const scaleX = (cssWidth * margin) / (2 * PROJECTED_X_MAX);
    const scaleY = (cssHeight * margin) / (2 * PROJECTED_Y_MAX);
    state.scale = Math.min(scaleX, scaleY);
    state.needsRedraw = true;
  }

  function drawMessage(text) {
    ctx.fillStyle = "#cfe3f7";
    ctx.font = "16px system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(text, cssWidth / 2, cssHeight / 2);
  }

  function drawLand() {
    const cx = cssWidth / 2;
    const cy = cssHeight / 2;

    // 陸地（穴を正しく抜くため evenodd で塗る。ストロークは行わない
    // ——約41万点規模のデータでドラッグ中も滑らかに保つため）。
    ctx.fillStyle = "#3f8f5f";

    for (const { unwrapped, range } of state.worldLand) {
      // リングは中心経度に依存しない連続経度で前処理済み。表示に必要な
      // 360°オフセットの候補を安価に絞り込んだうえで、各候補について
      // relLon ∈ [-180,180] へ明示的にクリップしてから投影する
      // （Equal Earth Projectionは緯度によってx方向スケールが変化するため、
      // 「表示範囲外はCanvasが自然にクリップする」という前提は成り立たない）。
      const shifts = longitudeShiftsForView(range, state.centerLonDeg);

      for (const shift of shifts) {
        const shifted = unwrapped.map(([lon, lat]) => [lon + shift - state.centerLonDeg, lat]);
        const clipped = clipRingToLongitudeWindow(shifted);
        if (clipped.length === 0) continue;

        ctx.beginPath();
        let started = false;
        for (const [relLon, lat] of clipped) {
          const p = projectRelative(relLon, lat, state.scale, cx, cy);
          if (!Number.isFinite(p.x) || !Number.isFinite(p.y)) {
            console.warn("Skipping non-finite projected point", relLon, lat);
            continue;
          }
          if (!started) {
            ctx.moveTo(p.x, p.y);
            started = true;
          } else {
            ctx.lineTo(p.x, p.y);
          }
        }
        ctx.closePath();
        ctx.fill("evenodd");
      }
    }
  }

  function drawMap() {
    ctx.clearRect(0, 0, cssWidth, cssHeight);

    // 海（背景）
    ctx.fillStyle = "#0b1a2b";
    ctx.fillRect(0, 0, cssWidth, cssHeight);

    if (state.loadStatus === "ready") {
      drawLand();
    } else if (state.loadStatus === "error") {
      drawMessage(`地図データの読み込みに失敗しました: ${state.loadError}`);
    } else {
      drawMessage("地図データを読み込み中…");
    }

    lonReadout.textContent = state.centerLonDeg.toFixed(1);
  }

  // ---------------------------------------------------------------------
  // Interaction module: ハンドラは状態更新のみ行い、描画は rAF ループに任せる
  // ---------------------------------------------------------------------
  canvas.addEventListener("pointerdown", (e) => {
    state.isDragging = true;
    state.lastPointerX = e.clientX;
    canvas.classList.add("dragging");
    canvas.setPointerCapture(e.pointerId);
  });

  canvas.addEventListener("pointermove", (e) => {
    if (!state.isDragging) return;
    const deltaPixels = e.clientX - state.lastPointerX;
    state.lastPointerX = e.clientX;
    const deltaLonDeg = dragDeltaToLongitudeDelta(deltaPixels, state.scale);
    state.centerLonDeg = normalizeLongitude(state.centerLonDeg + deltaLonDeg);
    state.needsRedraw = true;
  });

  function endDrag(e) {
    state.isDragging = false;
    canvas.classList.remove("dragging");
    if (e && e.pointerId !== undefined && canvas.hasPointerCapture(e.pointerId)) {
      canvas.releasePointerCapture(e.pointerId);
    }
  }

  canvas.addEventListener("pointerup", endDrag);
  canvas.addEventListener("pointercancel", endDrag);

  window.addEventListener("resize", resizeCanvas);

  // ---------------------------------------------------------------------
  // Main loop: 必要なときだけ再描画し、requestAnimationFrame でスムーズに回す
  // ---------------------------------------------------------------------
  function tick() {
    if (state.needsRedraw) {
      drawMap();
      state.needsRedraw = false;
    }
    requestAnimationFrame(tick);
  }

  resizeCanvas();
  loadWorldLand();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
